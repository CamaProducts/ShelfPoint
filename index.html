<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --navy: #21409A;        /* PMS Reflex Blue C - CAMA brand blue */
    --navy-dark: #14265A;   /* darker shade, sidebar surface */
    --navy-darker: #0D1B40;
    --lime: #B5D334;        /* PMS 376C - CAMA brand green */
    --lime-dark: #93AC29;
    --surface: #F4F6FA;
    --paper: #FFFFFF;
    --border: #DEE3EC;
    --ink: #1A2340;
    --slate: #5A6380;
    --slate-dim: #9099B0;
    --err: #B3261E;
    --err-tint: rgba(179,38,30,0.09);
    --ok: #1F7A45;
    --ok-tint: rgba(31,122,69,0.09);
    --sidebar-w: 240px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Verdana, sans-serif;
    background: var(--surface);
    color: var(--ink);
    font-size: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: var(--navy); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ============ LOGIN (chrome-free, own screen) ============ */
  .login-screen {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; background: var(--navy-darker); padding: 24px;
  }
  .login-logo { width: 200px; height: auto; margin-bottom: 4px; }
  .login-card {
    background: var(--paper); border-radius: 16px; padding: 36px 32px;
    width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 22px;
  }
  .prompt { font-size: 16px; color: var(--slate); }
  .display {
    font-size: 38px; font-weight: 700; letter-spacing: 0.08em; min-height: 50px;
    display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--ink);
  }
  .staffno-display { font-variant-numeric: tabular-nums; }
  .pin-dots { display: flex; gap: 14px; }
  .pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--border); transition: background 0.12s ease, border-color 0.12s ease; }
  .pin-dot.filled { background: var(--navy); border-color: var(--navy); }
  .error-msg { color: var(--err); font-size: 14px; min-height: 18px; text-align: center; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 300px; }
  .key {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink);
    font-size: 24px; font-weight: 500; border-radius: 12px; aspect-ratio: 1.3 / 1;
    display: flex; align-items: center; justify-content: center; user-select: none;
  }
  .key:active { background: #EAEDF2; }
  .key.func.primary { background: var(--navy); border-color: var(--navy); color: #fff; font-size: 14px; font-weight: 700; }
  .key.func.primary:active { background: var(--navy-dark); }
  .key.func.plain { background: transparent; border-color: transparent; font-size: 14px; color: var(--slate); }
  .key.func.plain:active { background: var(--surface); }
  .switch-user { background: none; border: none; color: var(--navy); font-size: 13px; padding: 8px; font-weight: 600; }
  .setup-warning {
    max-width: 340px; background: #FFF6E8; border: 1px solid #E8A33D; color: #8A5A16;
    padding: 14px 16px; border-radius: 10px; font-size: 13px; line-height: 1.5;
  }

  /* ============ APP SHELL ============ */
  .shell { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--navy-dark); color: #fff;
    display: flex; flex-direction: column; height: 100%;
  }
  .sidebar-logo {
    padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.12);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .sidebar-logo img { width: 110px; height: auto; display: block; }
  .sidebar-wordmark { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: rgba(255,255,255,0.85); }
  .sidebar-user { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.12); font-size: 12px; color: rgba(255,255,255,0.7); }
  .sidebar-user strong { display: block; color: #fff; font-size: 14px; margin-bottom: 2px; font-weight: 600; }
  .nav { flex: 1; padding: 10px 0; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 11px 18px; cursor: pointer;
    color: rgba(255,255,255,0.8); font-size: 14px; font-weight: 500;
    border-left: 3px solid transparent; transition: all 0.15s;
  }
  .nav-item:hover { color: #fff; background: rgba(255,255,255,0.06); }
  .nav-item.active { color: #fff; border-left-color: var(--lime); background: rgba(255,255,255,0.08); font-weight: 600; }
  .nav-item.disabled { color: rgba(255,255,255,0.35); cursor: default; }
  .nav-item.disabled:hover { background: none; color: rgba(255,255,255,0.35); }
  .dealer-context-group {
    background: rgba(181,211,52,0.07);
    border-left: 3px solid var(--lime);
    margin: 6px 0;
    padding-bottom: 4px;
  }
  .nav-section-label {
    padding: 14px 18px 6px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.02em; color: var(--lime);
  }
  .sidebar-footer { padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); }

  .main { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; min-width: 0; }
  .topbar {
    background: var(--paper); border-bottom: 1px solid var(--border); padding: 0 28px; height: 62px;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .topbar-title { font-size: 18px; font-weight: 700; }
  .topbar-subtitle { font-size: 12px; color: var(--slate-dim); margin-top: 1px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .search-wrap { position: relative; display: inline-block; }
  .search-input {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 34px 9px 14px; font-size: 14px; color: var(--ink); width: 260px;
  }
  .search-input:focus { outline: 2px solid var(--navy); outline-offset: -1px; }
  .search-icon {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    color: var(--slate-dim); pointer-events: none;
  }

  .content { flex: 1; overflow-y: auto; padding: 24px 28px; }

  /* ============ ACCOUNTS LIST (card rows) ============ */
  .list-header-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
    gap: 14px;
    padding: 12px 46px;
    background: var(--surface);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--navy);
    border-bottom: 2px solid var(--border);
    flex-shrink: 0;
  }
  .list-header-row .col { cursor: pointer; user-select: none; white-space: nowrap; }
  .list-header-row .col.sorted { color: var(--navy-dark); text-decoration: underline; }
  .list-header-row .col.right { text-align: right; }
  .account-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
    gap: 14px;
    align-items: center;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 18px;
    margin-bottom: 2px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .account-row:hover { border-color: var(--navy); box-shadow: 0 2px 8px rgba(33,64,154,0.08); }
  .account-row .col.right { text-align: right; }
  .acc-name { font-weight: 600; }
  .acc-sub { font-size: 12px; color: var(--slate-dim); margin-top: 2px; }
  .stop-credit-tag { color: var(--err); font-weight: 600; }
  .variance-badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 7px; white-space: nowrap; }
  .variance-up { background: var(--ok-tint); color: var(--ok); }
  .variance-down { background: var(--err-tint); color: var(--err); }
  .variance-steady { background: var(--surface); color: var(--slate); }
  .empty-state { color: var(--slate-dim); text-align: center; padding: 60px 0; width: 100%; }
  .result-count { font-size: 13px; color: var(--slate-dim); margin-bottom: 10px; }

  /* ============ ACCOUNT DETAIL ============ */
  .detail-section {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  .detail-section h2 { font-size: 15px; margin: 0 0 12px; }
  .chart { width: 100%; overflow-x: auto; }
  .chart-bars-row { display: flex; gap: 10px; height: 200px; align-items: flex-end; min-width: 820px; }
  .chart-value-label { font-size: 11px; line-height: 1.3; text-align: center; white-space: nowrap; }
  .chart-value-label.ty { color: var(--navy); font-weight: 700; }
  .chart-value-label.ly { color: #7C879C; font-weight: 600; }
  .chart-month { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .chart-bars { display: flex; gap: 3px; align-items: flex-end; height: 130px; width: 100%; justify-content: center; }
  .chart-bar { width: 12px; border-radius: 3px 3px 0 0; }
  .chart-bar.ty { background: var(--navy); }
  .chart-bar.ly { background: #A9B2C4; }
  .chart-month-label { font-size: 11px; color: var(--slate-dim); }
  .chart-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--slate); align-items: center; }
  .ytd-quarterly-row {
    display: flex; gap: 10px; margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--border); flex-wrap: wrap;
  }
  .ytd-quarterly-pill {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: var(--surface); border-radius: 8px; padding: 8px 14px;
  }
  .ytd-quarterly-pill.wide { flex: 0 0 auto; }
  .yq-label { font-size: 11px; color: var(--slate-dim); font-weight: 600; }
  .yq-triple { display: flex; gap: 18px; margin-top: 4px; }
  .yq-mini { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .yq-mini-label { font-size: 10px; color: var(--slate-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .yq-mini-value { font-size: 15px; font-weight: 700; color: var(--ink); }
  .sort-mode-toggle { display: flex; gap: 4px; background: var(--surface); border-radius: 8px; padding: 3px; }
  .sort-mode-btn {
    border: none; background: none; padding: 6px 12px; font-size: 12px; font-weight: 600;
    color: var(--slate); border-radius: 6px; cursor: pointer;
  }
  .sort-mode-btn.active { background: var(--paper); color: var(--navy); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .legend-dot.ty { background: var(--navy); }
  .legend-dot.ly { background: #A9B2C4; }
  .detail-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .detail-columns.uneven { grid-template-columns: 1fr 2fr; }
  .detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .detail-table th { text-align: left; color: var(--slate-dim); font-weight: 700; padding: 0 8px 8px; border-bottom: 1px solid var(--border); }
  .detail-table td { padding: 8px; border-bottom: 1px solid var(--border); }
  .placeholder-note { background: var(--paper); border: 1px dashed var(--border); color: var(--slate); font-size: 13px; padding: 14px; border-radius: 8px; }
  .gap-badge {
    display: inline-flex; align-items: center; gap: 4px; background: #FFF3EE; color: #C1501F;
    border: 1px solid #FFCBB0; border-radius: 6px; font-size: 11px; font-weight: 700;
    padding: 3px 8px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .in-range-tag { font-size: 12px; color: var(--ok); font-weight: 600; }
  .add-range-btn {
    padding: 5px 10px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--navy); background: var(--paper); color: var(--navy); margin-left: 6px;
  }
  .add-range-btn:hover { background: var(--navy); color: #fff; }
  .add-range-btn.gap-style { border-color: #C1501F; color: #C1501F; margin-left: 0; }
  .add-range-btn.gap-style:hover { background: #C1501F; color: #fff; }
  .add-range-btn.quick-add-btn { border-color: var(--lime-dark); color: var(--lime-dark); margin-left: 0; margin-top: 10px; }
  .add-range-btn.quick-add-btn:hover { background: var(--lime-dark); color: #fff; }
  .quick-add-form { margin-top: 10px; border-color: var(--lime-dark); }
  .wholegoods-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .wholegoods-table th {
    text-align: right; color: var(--slate-dim); font-weight: 700; padding: 0 10px 8px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .wholegoods-table th:first-child, .wholegoods-table th:nth-child(2) { text-align: left; }
  .wholegoods-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: right; }
  .wholegoods-table td:first-child, .wholegoods-table td:nth-child(2) { text-align: left; }
  .wholegoods-table tr.gap-row { background: #FFFAF8; }

  /* ---- Floor stock checklist ---- */
  .stock-line {
    display: flex; align-items: center; gap: 14px; background: var(--paper);
    border: 1px solid var(--border); border-left: 4px solid var(--border);
    border-radius: 8px; padding: 12px 16px; margin-bottom: 8px;
  }
  .stock-line.status-confirmed { background: rgba(181,211,52,0.16); border-left-color: var(--lime-dark); }
  .stock-line.status-updated { background: rgba(33,64,154,0.08); border-left-color: var(--navy); }
  .stock-line.status-new { background: rgba(181,211,52,0.07); border-left-color: var(--lime); }
  .stock-line-info { flex: 1; min-width: 0; }
  .stock-line-title { font-weight: 600; }
  .stock-line-sub { font-size: 12px; color: var(--slate-dim); }
  .stock-line-last {
    font-size: 12px; color: var(--slate-dim); font-style: italic; min-width: 110px;
  }
  .qty-stepper { display: flex; align-items: center; gap: 4px; }
  .qty-step-btn {
    width: 30px; height: 34px; border: 1px solid var(--border); background: var(--surface);
    color: var(--navy); font-size: 18px; font-weight: 700; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .qty-step-btn:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
  .stock-line-qty {
    width: 54px; padding: 8px 4px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; text-align: center;
  }
  .stock-line-status-tag {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    min-width: 74px; text-align: center;
  }
  .status-untouched .stock-line-status-tag { color: var(--slate-dim); }
  .status-confirmed .stock-line-status-tag { color: var(--lime-dark); }
  .status-updated .stock-line-status-tag { color: var(--navy); }
  .status-new .stock-line-status-tag { color: var(--lime-dark); }
  .confirm-btn {
    padding: 7px 12px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--paper); color: var(--slate);
  }
  .confirm-btn:hover { border-color: var(--lime-dark); color: var(--lime-dark); }
  .add-line-form {
    display: grid; grid-template-columns: 1fr 1fr 2fr 90px auto; gap: 10px; align-items: center;
    background: var(--surface); border: 1px dashed var(--border); border-radius: 8px;
    padding: 12px 16px; margin-bottom: 14px;
  }
  .add-line-form input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; width: 100%;
  }
  .add-line-form .search-input {
    /* The base .search-input border/background is too close to this
       form's own background/dashed border to read as a distinct field -
       give it a stronger, higher-contrast border here specifically. */
    border: 2px solid var(--navy); background: var(--paper);
  }
  .stock-search-results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    background: var(--paper); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12); max-height: 220px; overflow-y: auto;
  }
  .stock-search-result { padding: 9px 12px; font-size: 13px; cursor: pointer; }
  .stock-search-result:hover { background: var(--surface); }
  .send-report-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .send-report-btn {
    padding: 10px 20px; font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer;
    border: none; background: var(--navy); color: #fff;
  }
  .send-report-btn:hover { background: var(--navy-dark); }
  .send-report-btn:disabled { background: var(--border); color: var(--slate-dim); cursor: default; }
  .report-summary { font-size: 13px; color: var(--slate); }

  /* ---- Call notes tab ---- */
  .followup-banner {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    background: #FFF3EE; border: 1px solid #FFCBB0; border-radius: 8px; padding: 14px 16px;
    margin-bottom: 10px;
  }
  .followup-banner .fu-text { font-size: 14px; color: #8A3E1E; }
  .followup-banner .fu-meta { font-size: 11px; color: #B3653B; margin-top: 4px; }
  .followup-resolve-btn {
    flex-shrink: 0; padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 6px;
    cursor: pointer; border: 1px solid #C1501F; background: var(--paper); color: #C1501F;
  }
  .followup-resolve-btn:hover { background: #C1501F; color: #fff; }
  .add-followup-form { display: flex; gap: 10px; margin-top: 6px; }
  .add-followup-form textarea { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; resize: vertical; min-height: 40px; }
  .recent-call-card { border-bottom: 1px solid var(--border); padding: 10px 0; }
  .recent-call-card:last-child { border-bottom: none; }
  .recent-call-meta { font-size: 12px; color: var(--slate-dim); margin-bottom: 4px; }
  .recent-call-notes { font-size: 13px; white-space: pre-wrap; }
  .notes-textarea {
    width: 100%; min-height: 100px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical;
  }
  .order-table { width: 100%; border-collapse: collapse; }
  .order-table th {
    text-align: left; font-size: 12px; font-weight: 700; color: var(--slate-dim);
    padding: 0 10px 8px; border-bottom: 1px solid var(--border);
  }
  .order-table td { padding: 6px; border-bottom: 1px solid var(--border); }
  .order-table-input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; font-family: inherit;
  }
  .order-qty-cell { width: 54px; text-align: center; }
  .order-remove-btn { background: none; border: none; color: var(--err); font-size: 16px; cursor: pointer; font-weight: 700; }
  .toggle-switch { position: relative; display: inline-block; width: 42px; height: 23px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0; background: var(--border); border-radius: 24px;
    cursor: pointer; transition: 0.15s;
  }
  .toggle-slider:before {
    content: ""; position: absolute; height: 17px; width: 17px; left: 3px; bottom: 3px;
    background: #fff; border-radius: 50%; transition: 0.15s;
  }
  .toggle-switch input:checked + .toggle-slider { background: var(--lime-dark); }
  .toggle-switch input:checked + .toggle-slider:before { transform: translateX(19px); }
  .stock-line-note-slot { width: 340px; flex-shrink: 0; }
  .remove-item-slot { width: 210px; flex-shrink: 0; font-size: 11px; color: var(--err); }
  .remove-item-slot label { display: flex; align-items: flex-start; gap: 5px; cursor: pointer; line-height: 1.3; }
  .remove-item-slot input { margin-top: 2px; }
  .stock-line-note {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px;
  }
  .stock-line-wrap { display: flex; flex-direction: column; width: 100%; }
  .stock-line-row { display: flex; align-items: center; gap: 14px; width: 100%; }
  .order-btn {
    padding: 7px 12px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--lime-dark); background: var(--paper); color: var(--lime-dark); white-space: nowrap;
  }
  .order-btn:hover { background: var(--lime); color: var(--navy-dark); }
  .order-btn.added { border-color: var(--border); color: var(--slate-dim); cursor: default; background: var(--surface); }
  .see-more-btn { width: 100%; margin-top: 8px; background: var(--paper); border: 1px solid var(--border); color: var(--navy); font-size: 13px; padding: 9px; border-radius: 8px; font-weight: 600; }
  .group-picker { position: relative; display: inline-block; margin-bottom: 14px; }
  .group-picker-btn { background: var(--paper); border: 1px solid var(--border); color: var(--ink); font-size: 14px; padding: 9px 14px; border-radius: 8px; }
  .group-picker-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; background: var(--paper);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    width: 320px; max-height: 340px; overflow-y: auto; padding: 8px;
  }
  .group-picker-panel label { display: flex; align-items: center; gap: 8px; padding: 7px 8px; font-size: 13px; border-radius: 6px; cursor: pointer; }
  .group-picker-panel label:hover { background: var(--surface); }
  .group-picker-panel label.disabled { color: var(--slate-dim); cursor: not-allowed; }
  .group-picker-hint { font-size: 12px; color: var(--slate-dim); padding: 6px 8px 2px; }

  section#accountsView, section#detailView { height: 100%; display: flex; flex-direction: column; }
</style>
</head>

  let staffno = ''
  let pin = ''
  let stepError = ''

  function fakeEmail(sno) { return `staff${sno}@camarep.internal` }

  // ---------- STAFF NUMBER ENTRY ----------
  function renderStaffEntry() {
    loginStage.innerHTML = `
      <div class="prompt">Enter your staff number</div>
      <div class="display staffno-display">${staffno.padEnd(1, '\u2007') || '&nbsp;'}</div>
      <div class="error-msg">${stepError}</div>
      <div class="keypad" id="keypad"></div>
    `
    buildKeypad(onStaffKey, false)
  }

  function onStaffKey(key) {
    stepError = ''
    if (key === 'back') { staffno = staffno.slice(0, -1); renderStaffEntry(); return }
    if (key === 'clear') { staffno = ''; renderStaffEntry(); return }
    if (key === 'next') {
      if (staffno.length === 0) { stepError = 'Enter your staff number'; renderStaffEntry(); return }
      pin = ''
      renderPinEntry()
      return
    }
    if (staffno.length < 6) staffno += key
    renderStaffEntry()
  }

  // ---------- PIN ENTRY ----------
  function renderPinEntry(submitting = false) {
    const dots = Array.from({ length: 6 }, (_, i) =>
      `<div class="pin-dot ${i < pin.length ? 'filled' : ''}"></div>`
    ).join('')
    loginStage.innerHTML = `
      <div class="prompt">Staff #${staffno} — enter PIN</div>
      <div class="pin-dots">${dots}</div>
      <div class="error-msg">${submitting ? 'Checking…' : stepError}</div>
      <div class="keypad" id="keypad"></div>
      <button class="switch-user" id="switchUser">Not you? Switch staff number</button>
    `
    document.getElementById('switchUser').onclick = () => {
      staffno = ''; pin = ''; stepError = ''
      renderStaffEntry()
    }
    buildKeypad(onPinKey, true)
  }

  async function onPinKey(key) {
    stepError = ''
    if (key === 'back') { pin = pin.slice(0, -1); renderPinEntry(); return }
    if (key === 'clear') { pin = ''; renderPinEntry(); return }
    if (key === 'next') {
      if (pin.length < 6) { stepError = 'PIN must be 6 digits'; renderPinEntry(); return }
      renderPinEntry(true)
      const { data, error } = await supabase.auth.signInWithPassword({
        email: fakeEmail(staffno),
        password: pin,
      })
      if (error) {
        stepError = 'Staff number or PIN not recognised. Try again.'
        pin = ''
        renderPinEntry()
        return
      }
      enterApp(data.user)
      return
    }
    if (pin.length < 6) pin += key
    renderPinEntry()
  }

  function buildKeypad(onKey, isPin) {
    const keypad = document.getElementById('keypad')
    const rows = ['1','2','3','4','5','6','7','8','9','clear','0','next']
    keypad.innerHTML = rows.map(k => {
      if (k === 'clear') return `<button class="key func plain" data-k="clear">Clear</button>`
      if (k === 'next') return `<button class="key func primary" data-k="next">${isPin ? 'Log in' : 'Next'}</button>`
      return `<button class="key" data-k="${k}">${k}</button>`
    }).join('')
    keypad.querySelectorAll('.key').forEach(btn => {
      btn.addEventListener('click', () => onKey(btn.dataset.k))
    })
  }

  function enterApp(user) {
    loginScreen.style.display = 'none'
    appShell.style.display = 'flex'
    showLoggedIn(user)
  }

  async function doLogout() {
    await supabase.auth.signOut()
    staffno = ''; pin = ''
    appShell.style.display = 'none'
    loginScreen.style.display = 'flex'
    renderStaffEntry()
  }

  function daysAgoLabel(dateStr, emptyText = 'No orders on record') {
    if (!dateStr) return emptyText
    // Parse as a local calendar date, not UTC midnight - avoids a
    // timezone bug where "yesterday" could show as "Today" for
    // anyone well ahead of UTC (like NZ).
    const [y, m, d] = dateStr.split('-').map(Number)
    const orderDate = new Date(y, m - 1, d)
    const now = new Date()
    const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate())
    const days = Math.round((todayMidnight - orderDate) / 86400000)
    if (days <= 0) return 'Today'
    if (days === 1) return 'Yesterday'
    return `${days} days ago`
  }

  function fmtEtaDate(dateStr) {
    if (!dateStr) return null
    // Same local-calendar-date parsing as daysAgoLabel, for the same reason.
    const [y, m, d] = dateStr.split('-').map(Number)
    return new Date(y, m - 1, d).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' })
  }

  function varianceBadge(pct) {
    if (pct === null || pct === undefined) return `<span class="variance-badge variance-steady">New</span>`
    const rounded = Math.round(pct)
    if (rounded >= 10) return `<span class="variance-badge variance-up">+${rounded}%</span>`
    if (rounded <= -10) return `<span class="variance-badge variance-down">${rounded}%</span>`
    return `<span class="variance-badge variance-steady">${rounded}%</span>`
  }

  function dollarChangeBadge(value) {
    if (value === null || value === undefined) return `<span class="variance-badge variance-steady">New</span>`
    const rounded = Math.round(Number(value))
    const formatted = '$' + Math.abs(rounded).toLocaleString()
    if (rounded > 0) return `<span class="variance-badge variance-up">+${formatted}</span>`
    if (rounded < 0) return `<span class="variance-badge variance-down">-${formatted}</span>`
    return `<span class="variance-badge variance-steady">${formatted}</span>`
  }

  function compactCurrency(v) {
    const n = Number(v)
    if (n >= 1000) return '$' + (n / 1000).toFixed(1) + 'k'
    return '$' + Math.round(n)
  }

  function fullDollar(v) {
    return '$' + Math.round(Number(v)).toLocaleString()
  }

  // NZ date style (DD/MM/YYYY) - never rely on the browser's own
  // locale formatting, which often defaults to US style.
  function formatNZDate(dateInput) {
    if (!dateInput) return ''
    const d = new Date(dateInput)
    if (isNaN(d.getTime())) return ''
    const dd = String(d.getDate()).padStart(2, '0')
    const mm = String(d.getMonth() + 1).padStart(2, '0')
    const yyyy = d.getFullYear()
    return `${dd}/${mm}/${yyyy}`
  }

  // Stock groups to hide from the picker entirely, and a rule for
  // combining variants of the same group under one entry.
  const EXCLUDED_GROUP_NAMES = new Set([
    'ALLEN', 'ALLEN (ND)', 'BR. BRILL', 'CCT. CONCRETE TOOLS', 'EU. EUROTILLER',
    'EX. EXEL', 'FREIGHT OUT', 'IB. IBEA', 'KL. KOHLER ENGINES', 'MISC ITEMS',
    'OT. OTHER WHOLEGOODS', 'PR. PRECISION', 'QC. QUALCAST', 'SP. SEP', 'TRADESMART',
  ].map(s => s.toUpperCase()))

  function canonicalGroupRef(name) {
    return (name || '').replace(/\s*\((ND|HUSQ)\)\s*$/i, '').trim()
  }

  // Groups often share a leading numeric code (e.g. "65- Spindles...")
  // even when the text after it was typed inconsistently over the
  // years (extra space, extra words, abbreviations). That number is
  // the real category identity - group by it when present, and pick
  // the longest/most complete name among the variants as the label.
  function groupingKey(name) {
    const n = (name || '').trim()
    const prefixMatch = n.match(/^(\d+)\s*-/)
    if (prefixMatch) return 'PFX:' + prefixMatch[1]
    return 'NAME:' + canonicalGroupRef(n).toUpperCase()
  }

  function buildGroupPickerData(rawGroups) {
    const filtered = rawGroups.filter(g => !EXCLUDED_GROUP_NAMES.has((g.groupname || '').toUpperCase().trim()))
    const byKey = new Map()
    filtered.forEach(g => {
      const key = groupingKey(g.groupname)
      if (!byKey.has(key)) byKey.set(key, { groupnos: [], names: [] })
      byKey.get(key).groupnos.push(g.groupno)
      byKey.get(key).names.push(g.groupname)
    })
    const entries = [...byKey.values()].map(v => ({
      ref: canonicalGroupRef(v.names.reduce((a, b) => (b.length > a.length ? b : a))),
      groupnos: v.groupnos,
    }))
    return entries.sort((a, b) => a.ref.localeCompare(b.ref))
  }

  function groupnoToRefMap(groupEntries) {
    const map = new Map()
    groupEntries.forEach(entry => entry.groupnos.forEach(gno => map.set(gno, entry.ref)))
    return map
  }

  function aggregateCategoryResultsByRef(rawResults, groupEntries) {
    const gnoToRef = groupnoToRefMap(groupEntries)
    const byRef = new Map()
    rawResults.forEach(r => {
      const ref = gnoToRef.get(r.groupno) || r.groupname
      if (!byRef.has(ref)) byRef.set(ref, { groupname: ref, recent_total: 0, prior_total: 0 })
      const entry = byRef.get(ref)
      entry.recent_total += Number(r.recent_total)
      entry.prior_total += Number(r.prior_total)
    })
    return [...byRef.values()].map(e => ({
      groupname: e.groupname,
      recent_total: e.recent_total,
      prior_total: e.prior_total,
      variance_pct: e.prior_total === 0 ? null : Math.round((e.recent_total - e.prior_total) / e.prior_total * 100),
    }))
  }

  function applyFilters(list) {
    let out = list
    if (repFilter !== 'all') {
      out = out.filter(d => String(d.rep_salesno) === repFilter)
    }
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase()
      out = out.filter(d => d.name.toLowerCase().includes(q) || String(d.accno).includes(q))
    }
    return out
  }

  function sortDealers(list, sort, dir) {
    const copy = [...list]
    if (sort === 'name') copy.sort((a, b) => dir * a.name.localeCompare(b.name))
    if (sort === 'rep') copy.sort((a, b) => dir * (a.rep_name || '').localeCompare(b.rep_name || ''))
    if (sort === 'variance') copy.sort((a, b) => dir * ((a.variance_pct ?? 999) - (b.variance_pct ?? 999)))
    if (sort === 'ytd') copy.sort((a, b) => dir * ((a.rolling12_change ?? 0) - (b.rolling12_change ?? 0)))
    if (sort === 'last_order') copy.sort((a, b) => {
      if (!a.last_order_date) return -1 * dir
      if (!b.last_order_date) return 1 * dir
      return dir * (new Date(a.last_order_date) - new Date(b.last_order_date))
    })
    if (sort === 'last_visit') copy.sort((a, b) => {
      if (!a.last_visit_date) return -1 * dir
      if (!b.last_visit_date) return 1 * dir
      return dir * (new Date(a.last_visit_date) - new Date(b.last_visit_date))
    })
    return copy
  }

        <div id="stockLookupResults" style="margin-top:16px;"></div>
      </div>
    `

    let searchTimeout = null
    document.getElementById('stockLookupSearch').addEventListener('input', (e) => {
      clearTimeout(searchTimeout)
      const q = e.target.value.trim()
      const resultsEl = document.getElementById('stockLookupResults')
      if (q.length < 2) { resultsEl.innerHTML = ''; return }
      searchTimeout = setTimeout(async () => {
        resultsEl.innerHTML = `<div class="empty-state">Searching…</div>`
        const { data, error } = await supabase
          .from('stock_items')
          .select('stockcode, description, soh')
          .eq('stockgroup2', 2)
          .eq('is_active', true)
          .or(`stockcode.ilike.%${q}%,description.ilike.%${q}%`)
          .order('description')
          .limit(30)
        if (error) { resultsEl.innerHTML = `<div class="empty-state">Search failed: ${error.message}</div>`; return }
        if (!data || data.length === 0) { resultsEl.innerHTML = `<div class="placeholder-note">No wholegoods match "${q}".</div>`; return }

        // Zero-stock items get an ETA from the nearest outstanding
        // purchase order, if there is one - one batched lookup for
        // however many zero-stock rows are in this result set, not one
        // query per row.
        const zeroStockCodes = data.filter(item => !(Number(item.soh) > 0)).map(item => item.stockcode)
        let etaByStockcode = {}
        if (zeroStockCodes.length > 0) {
          const { data: etaRows } = await supabase
            .from('stock_po_eta')
            .select('stockcode, eta_date')
            .in('stockcode', zeroStockCodes)
          etaByStockcode = Object.fromEntries((etaRows || []).map(r => [r.stockcode, r.eta_date]))
        }

        resultsEl.innerHTML = `
          <table class="detail-table">
            <thead><tr><th>Part number</th><th>Description</th><th>Stock on hand</th><th>ETA</th></tr></thead>
            <tbody>${data.map(item => {
              const inStock = Number(item.soh) > 0
              const eta = inStock ? null : fmtEtaDate(etaByStockcode[item.stockcode])
              return `
              <tr style="background:${inStock ? 'var(--ok-tint)' : 'var(--err-tint)'};">
                <td>${item.stockcode}</td>
                <td>${item.description || '—'}</td>
                <td style="font-weight:700; color:${inStock ? 'var(--ok)' : 'var(--err)'};">${item.soh != null ? Number(item.soh) : '—'}</td>
                <td>${eta || (inStock ? '' : '—')}</td>
              </tr>`}).join('')}
            </tbody>
          </table>
        `
      }, 300)
    })
  }
