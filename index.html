        <div class="chart-bars">
          <div class="chart-bar ty" style="height:${(Number(m.this_year_total) / maxVal * 100).toFixed(1)}%" title="This year: $${Number(m.this_year_total).toFixed(0)}"></div>
          <div class="chart-bar ly" style="height:${(Number(m.last_year_total) / maxVal * 100).toFixed(1)}%" title="Last year: $${Number(m.last_year_total).toFixed(0)}"></div>
        </div>
        <div class="chart-month-label">${m.month_name}</div>
      </div>
    `).join('')

    const ranked = variance.filter(v => v.variance_pct !== null).map(v => ({
      ...v,
      dollar_change: Number(v.recent_total) - Number(v.prior_total),
      unit_change: Number(v.recent_qty) - Number(v.prior_qty),
    }))
    function sortKeyFor(mode) {
      if (mode === 'units') return 'unit_change'
      if (mode === 'percent') return 'variance_pct'
      return 'dollar_change'
    }
    const sortKey = sortKeyFor(gainsDeclinesSortMode)
    const gains = [...ranked].sort((a, b) => b[sortKey] - a[sortKey]).slice(0, 20)
    const declines = [...ranked].sort((a, b) => a[sortKey] - b[sortKey]).slice(0, 20)

    function varianceTable(list, visibleCount, onSeeMore) {
      if (list.length === 0) return `<div class="empty-state">Nothing to show yet.</div>`
      const shown = list.slice(0, visibleCount)
      const rows = shown.map(v => `
        <tr>
          <td>${v.stockcode}<div class="acc-sub">${v.description || ''}</div></td>
          <td>$${Number(v.recent_total).toFixed(0)}<div class="acc-sub">${Number(v.recent_qty).toFixed(0)} units</div></td>
          <td>$${Number(v.prior_total).toFixed(0)}<div class="acc-sub">${Number(v.prior_qty).toFixed(0)} units</div></td>
          <td>${varianceBadge(v.variance_pct)}</td>
        </tr>`).join('')
      const seeMore = visibleCount < list.length
        ? `<button class="see-more-btn" data-more="${onSeeMore}">See ${Math.min(10, list.length - visibleCount)} more</button>`
        : ''
      return `
        <table class="detail-table">
          <thead><tr><th>Product</th><th>This yr</th><th>Last yr</th><th>Variance</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${seeMore}`
    }

    function specialsTable(list, visibleCount) {
      if (list.length === 0) return `<div class="placeholder-note">No current specials that this dealer has bought in the last 12 months.</div>`
      const shown = list.slice(0, visibleCount)
      const rows = shown.map(s => `
        <tr>
          <td>${s.stockcode}</td>
          <td>${s.description || '—'}</td>
          <td>${s.times_bought_12mo} units</td>
          <td style="text-align:left; white-space:nowrap;">${orderButtonHtml(s.stockcode, s.description)}</td>
        </tr>`).join('')
      const seeMore = visibleCount < list.length
        ? `<button class="see-more-btn" data-more="specials">See ${Math.min(5, list.length - visibleCount)} more</button>`
        : ''
      return `
        <table class="detail-table">
          <thead><tr><th>Part number</th><th>Description</th><th>Bought (12mo)</th><th>Order</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${seeMore}`
    }

    function groupPickerHtml() {
      if (!allStockGroups) return `<div class="empty-state">Loading groups…</div>`
      const options = allStockGroups.map(g => {
        const checked = selectedRefs.includes(g.ref)
        const disabled = !checked && selectedRefs.length >= 5
        return `<label class="${disabled ? 'disabled' : ''}">
          <input type="checkbox" data-ref="${g.ref}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
          ${g.ref}
        </label>`
      }).join('')
      return `<div class="group-picker-hint">Pick up to 5 groups to compare</div>${options}`
    }

    function categoryResultsHtml() {
      if (selectedRefs.length === 0) return `<div class="placeholder-note">Pick up to 5 stock groups above to see this dealer's spend in them.</div>`
      if (categoryResults.length === 0) return `<div class="empty-state">Loading…</div>`
      return `
        <table class="detail-table">
          <thead><tr><th>Group</th><th>This yr</th><th>Last yr</th><th>Variance</th></tr></thead>
          <tbody>${categoryResults.map(c => `
            <tr>
              <td>${c.groupname}</td>
              <td>$${Number(c.recent_total).toFixed(0)}</td>
              <td>$${Number(c.prior_total).toFixed(0)}</td>
              <td>${varianceBadge(c.variance_pct)}</td>
            </tr>`).join('')}
          </tbody>
        </table>`
    }

    content.innerHTML = `
      <div class="detail-section">
        <h2>Monthly spend — this year vs last year</h2>
        <div class="chart"><div class="chart-bars-row">${bars}</div></div>
        <div class="chart-legend"><span class="legend-dot ty"></span>This year<span style="width:10px"></span><span class="legend-dot ly"></span>Last year</div>
        <div class="ytd-quarterly-row">
          ${ytdQuarterly.map(item => {
            if (item.metric === 'rolling12') {
              return `
                <div class="ytd-quarterly-pill wide">
                  <div class="yq-label">${item.label}</div>
                  <div class="yq-triple">
                    <div class="yq-mini">
                      <div class="yq-mini-label">This year</div>
                      <div class="yq-mini-value">${fullDollar(item.this_total)}</div>
                    </div>
                    <div class="yq-mini">
                      <div class="yq-mini-label">Last year</div>
                      <div class="yq-mini-value">${fullDollar(item.last_total)}</div>
                    </div>
                    <div class="yq-mini">
                      <div class="yq-mini-label">Change</div>
                      ${dollarChangeBadge(item.dollar_change)}
                    </div>
                  </div>
                </div>`
            }
            return `
              <div class="ytd-quarterly-pill">
                <div class="yq-label">${item.label}</div>
                ${dollarChangeBadge(item.dollar_change)}
              </div>`
          }).join('')}
        </div>
      </div>
      <div class="detail-section">
        <h2>Category breakdown</h2>
        <div class="group-picker">
          <button class="group-picker-btn" id="groupPickerBtn">Pick stock groups (${selectedRefs.length}/5) ▾</button>
          <div class="group-picker-panel" id="groupPickerPanel" style="display:none;">${groupPickerHtml()}</div>
        </div>
        <div id="categoryResults">${categoryResultsHtml()}</div>
      </div>
      <div class="detail-section">
        <div style="display:flex; justify-content:center; margin-bottom:14px;">
          <div class="sort-mode-toggle">
            <button class="sort-mode-btn ${gainsDeclinesSortMode === 'value' ? 'active' : ''}" data-mode="value">Value</button>
            <button class="sort-mode-btn ${gainsDeclinesSortMode === 'units' ? 'active' : ''}" data-mode="units">Units</button>
            <button class="sort-mode-btn ${gainsDeclinesSortMode === 'percent' ? 'active' : ''}" data-mode="percent">Percentage</button>
          </div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
          <div>
            <h2>Top 20 — biggest gains</h2>
            <div id="gainsTable">${varianceTable(gains, visibleGains, 'gains')}</div>
          </div>
          <div>
            <h2>Top 20 — biggest declines</h2>
            <div id="declinesTable">${varianceTable(declines, visibleDeclines, 'declines')}</div>
          </div>
        </div>
      </div>
      <div class="detail-columns uneven">
        <div class="detail-section">
          <h2>Price policies loaded on this account</h2>
          ${discounts.length === 0
            ? `<div class="placeholder-note">No active price policies for this account right now.</div>`
            : `<table class="detail-table"><thead><tr><th>Policy</th></tr></thead>
                <tbody>${discounts.map(d => `<tr><td>${d.policy_ref}</td></tr>`).join('')}</tbody>
              </table>`}
        </div>
        <div class="detail-section">
          <h2>This month's specials this dealer often buys</h2>
          <div id="specialsTable">${specialsTable(specials, visibleSpecials)}</div>
        </div>
      </div>
    `

    content.querySelectorAll('.see-more-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.more === 'gains') visibleGains += 10
        if (btn.dataset.more === 'declines') visibleDeclines += 10
        if (btn.dataset.more === 'specials') visibleSpecials += 5
        renderAccountDetail(dealer, accno, monthly, variance, discounts, specials, ytdQuarterly)
      })
    })
    content.querySelectorAll('.sort-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        gainsDeclinesSortMode = btn.dataset.mode
        visibleGains = 10
        visibleDeclines = 10
        renderAccountDetail(dealer, accno, monthly, variance, discounts, specials, ytdQuarterly)
      })
    })

    const pickerBtn = document.getElementById('groupPickerBtn')
    const pickerPanel = document.getElementById('groupPickerPanel')
    pickerBtn.onclick = async () => {
      if (!allStockGroups) {
        const { data } = await supabase.from('stock_groups').select('groupno, groupname').eq('is_active', true).order('groupname')
        allStockGroups = buildGroupPickerData(data || [])
        pickerPanel.innerHTML = groupPickerHtml()
        wireGroupCheckboxes()
      }
      pickerPanel.style.display = pickerPanel.style.display === 'none' ? 'block' : 'none'
    }
    function wireGroupCheckboxes() {
      pickerPanel.querySelectorAll('input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', async (e) => {
          const ref = e.target.dataset.ref
          if (e.target.checked) selectedRefs.push(ref)
          else selectedRefs = selectedRefs.filter(r => r !== ref)
          pickerBtn.textContent = `Pick stock groups (${selectedRefs.length}/5) ▾`
          pickerPanel.innerHTML = groupPickerHtml()
          wireGroupCheckboxes()
          if (selectedRefs.length > 0) {
            const selectedEntries = allStockGroups.filter(g => selectedRefs.includes(g.ref))
            const flatGroupnos = selectedEntries.flatMap(g => g.groupnos)
            const { data } = await supabase.rpc('get_category_spend', { p_accno: accno, p_groupnos: flatGroupnos })
            categoryResults = aggregateCategoryResultsByRef(data || [], selectedEntries)
          } else {
            categoryResults = []
          }
          document.getElementById('categoryResults').innerHTML = categoryResultsHtml()
        })
      })
    }
    wireGroupCheckboxes()
    document.addEventListener('click', function closePickerOnOutsideClick(e) {
      if (!pickerBtn.contains(e.target) && !pickerPanel.contains(e.target)) {
        pickerPanel.style.display = 'none'
      }
    }, { once: true })

    content.querySelectorAll('.order-btn[data-ordersku]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentOrderList.push({ sku: btn.dataset.ordersku, description: btn.dataset.orderdesc, qty: 1 })
        renderAccountDetail(dealer, accno, monthly, variance, discounts, specials, ytdQuarterly)
      })
    })
  }

  // ---------- WHOLEGOODS & RANGES TAB ----------
  let checklistState = {}
  let newLineSeq = 0
  let addLineFormOpen = false
  let quickAddFormOpen = false
  let cachedHistoryRows = []
  let wholegoodsInitialized = false

  function initChecklistState(rows) {
    checklistState = {}
    rows.forEach(r => {
      checklistState[r.id] = {
        id: r.id, brand: r.brand, sku: r.sku, description: r.description,
        last_recorded_qty: r.last_recorded_qty, qty: r.last_recorded_qty,
        confirmed: false, isNew: false, note: r.notes || '', markedForRemoval: false,
      }
    })
  }

  function computeAutoStatus(entry) {
    if (entry.isNew) return 'new'
    if (Number(entry.qty) !== Number(entry.last_recorded_qty)) return 'updated'
    return entry.confirmed ? 'confirmed' : 'untouched'
  }

  function isInOrderList(sku) {
    return currentOrderList.some(o => o.sku === sku)
  }

  function orderButtonHtml(sku, description) {
    return isInOrderList(sku)
      ? `<button class="order-btn added" disabled>✓ On order</button>`
      : `<button class="order-btn" data-ordersku="${sku}" data-orderdesc="${(description || '').replace(/"/g, '&quot;')}">+ Add to order</button>`
  }

  async function showWholegoodsTab(accno) {
    resetVisitIfNewDealer(accno)
    document.getElementById('listHeaderRow').style.display = 'none'
    const dealer = currentDealers.find(d => d.accno === accno)
    renderDetailSidebar(dealer ? dealer.name : null, accno, 'wholegoods')
    topbarTitle.textContent = dealer ? dealer.name : 'Account'
    topbarSubtitle.textContent = `Account #${accno}`
    topbarRight.innerHTML = ''

    if (wholegoodsInitialized) {
      // Already loaded during this visit - just re-render, keep whatever
      // toggles/edits/notes the rep has made so far.
      renderWholegoodsPage(accno, dealer ? dealer.name : `Account #${accno}`)
      return
    }

    content.innerHTML = `<div class="empty-state">Loading…</div>`
    const [
      { data: checklistRows, error: checklistErr },
      { data: historyRows, error: historyErr },
    ] = await Promise.all([
      supabase.from('dealer_floor_stock').select('*').eq('accno', accno).eq('is_active', true).order('brand'),
      supabase.rpc('get_wholegoods_history', { p_accno: accno }),
    ])

    if (checklistErr || historyErr) {
      const err = checklistErr || historyErr
      content.innerHTML = `<div class="empty-state">Couldn't load wholegoods tab: ${err.message}</div>`
      return
    }

    initChecklistState(checklistRows || [])
    addLineFormOpen = false
    cachedHistoryRows = historyRows || []
    wholegoodsInitialized = true
    renderWholegoodsPage(accno, dealer ? dealer.name : `Account #${accno}`)
  }

  function checklistLineHtml(entry) {
    const status = computeAutoStatus(entry)
    const qtyDecreased = !entry.isNew && entry.last_recorded_qty !== null &&
      Number(entry.qty) < Number(entry.last_recorded_qty)
    const showRemoveOption = !entry.isNew && Number(entry.qty) === 0
    return `
      <div class="stock-line-wrap">
        <div class="stock-line status-${status}">
          <div class="stock-line-row">
            <div class="stock-line-info">
              <div class="stock-line-title">${entry.brand || ''}${entry.brand && entry.sku ? ' · ' : ''}${entry.sku || ''}</div>
              <div class="stock-line-sub">${entry.description || ''}</div>
            </div>
            <div class="remove-item-slot">
              ${showRemoveOption ? `
                <label>
                  <input type="checkbox" class="remove-item-checkbox" data-id="${entry.id}" ${entry.markedForRemoval ? 'checked' : ''}>
                  Remove from floor stock checklist - reason required.
                </label>
              ` : ''}
            </div>
            <div class="stock-line-note-slot">
              ${qtyDecreased ? `<input class="stock-line-note" placeholder="Why the drop? e.g. restock next month" data-id="${entry.id}" value="${entry.note || ''}">` : ''}
            </div>
            <div class="stock-line-last">${entry.isNew ? 'New line' : `Last recorded: ${entry.last_recorded_qty}`}</div>
            <div class="qty-stepper">
              <button class="qty-step-btn" data-id="${entry.id}" data-dir="-1">−</button>
              <input class="stock-line-qty" type="number" min="0" data-id="${entry.id}" value="${entry.qty}">
              <button class="qty-step-btn" data-id="${entry.id}" data-dir="1">+</button>
            </div>
            <div class="stock-line-status-tag">${status}</div>
            <label class="toggle-switch">
              <input type="checkbox" ${entry.confirmed ? 'checked' : ''} data-id="${entry.id}" class="stock-toggle">
              <span class="toggle-slider"></span>
            </label>
            ${orderButtonHtml(entry.sku, entry.description)}
          </div>
        </div>
      </div>`
  }

  function renderWholegoodsPage(accno, dealerName) {
    const entries = Object.values(checklistState).sort((a, b) => (a.brand || '').localeCompare(b.brand || ''))
    const confirmedCount = entries.filter(e => computeAutoStatus(e) === 'confirmed').length
    const updatedCount = entries.filter(e => computeAutoStatus(e) === 'updated').length
    const newCount = entries.filter(e => computeAutoStatus(e) === 'new').length
    const hasChanges = confirmedCount + updatedCount + newCount > 0

    const byStock = new Map()
    const years = new Set()
    cachedHistoryRows.forEach(r => {
      years.add(r.yr)
      if (!byStock.has(r.stockcode)) {
        byStock.set(r.stockcode, { stockcode: r.stockcode, description: r.description, in_range: r.in_range, byYear: {}, total: 0 })
      }
      const e = byStock.get(r.stockcode)
      e.byYear[r.yr] = Number(r.qty)
      e.total += Number(r.total)
    })
    const sortedYears = [...years].sort((a, b) => a - b)
    const historyItems = [...byStock.values()].sort((a, b) => {
      if (a.in_range !== b.in_range) return a.in_range ? 1 : -1
      return b.total - a.total
    })
    const gapCount = historyItems.filter(i => !i.in_range).length

    function historyRow(item) {
      const yearCells = sortedYears.map(y => `<td>${item.byYear[y] ? item.byYear[y] : '—'}</td>`).join('')
      const rangeCell = item.in_range
        ? `<span class="in-range-tag">✓ In range</span>`
        : `<button class="add-range-btn gap-style" data-stockcode="${item.stockcode}" data-description="${(item.description || '').replace(/"/g, '&quot;')}">+ Add to range</button>`
      return `
        <tr class="${item.in_range ? '' : 'gap-row'}">
          <td>${item.stockcode}</td>
          <td>${item.description || '—'}</td>
          ${yearCells}
          <td>$${item.total.toFixed(0)}</td>
          <td style="text-align:left; white-space:nowrap;">${rangeCell}</td>
          <td style="text-align:left; white-space:nowrap;">${orderButtonHtml(item.stockcode, item.description)}</td>
        </tr>`
    }

    const orderSummary = currentOrderList.length > 0
      ? `${currentOrderList.length} item${currentOrderList.length === 1 ? '' : 's'} on order for this visit`
      : 'No items on order yet'

    content.innerHTML = `
      <div class="detail-section">
        <h2>Floor Stock Checklist</h2>
        ${entries.length === 0 && !addLineFormOpen
          ? `<div class="placeholder-note">No floor stock recorded for this dealer yet. Use "Add new line" below to start one.</div>`
          : entries.map(checklistLineHtml).join('')}
        ${addLineFormOpen ? `
          <div class="add-line-form">
            <div class="search-wrap" style="grid-column: 1 / -1; display: block;">
              <input class="search-input" id="newLineStockSearch" type="text" placeholder="Search by SKU or model to fill in the fields below" style="width:100%;">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <div class="stock-search-results" id="newLineStockResults" style="display:none;"></div>
            </div>
            <input id="newSku" placeholder="SKU / model">
            <input id="newBrand" placeholder="Brand">
            <input id="newDesc" placeholder="Description">
            <input id="newQty" type="number" min="0" placeholder="Qty" value="1">
            <button class="confirm-btn" id="confirmAddLine">Add</button>
          </div>
        ` : `<button class="add-range-btn" id="openAddLine">+ Add new line</button>`}
        ${currentIsManager ? (quickAddFormOpen ? `
          <div class="add-line-form quick-add-form">
            <div class="search-wrap" style="grid-column: 1 / -1; display: block;">
              <input class="search-input" id="quickAddStockSearch" type="text" placeholder="Search by SKU or model to fill in the fields below" style="width:100%;">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <div class="stock-search-results" id="quickAddStockResults" style="display:none;"></div>
            </div>
            <input id="quickSku" placeholder="SKU / model">
            <input id="quickBrand" placeholder="Brand">
            <input id="quickDesc" placeholder="Description">
            <input id="quickQty" type="number" min="0" placeholder="Qty" value="1">
            <button class="confirm-btn" id="confirmQuickAdd">Save now</button>
          </div>
          <div class="acc-sub" style="margin-top:6px;">Saves straight to the checklist — doesn't touch call notes or create a visit record.</div>
        ` : `<button class="add-range-btn quick-add-btn" id="openQuickAdd">+ Quick add (saves immediately, no report needed)</button>`) : ''}
        <div class="send-report-bar">
          <div class="report-summary">
            ${hasChanges ? `${confirmedCount} confirmed · ${updatedCount} updated · ${newCount} new` : 'No changes yet'}
            &nbsp;·&nbsp; ${orderSummary}
          </div>
        </div>
        <div class="placeholder-note" style="margin-top:10px;">
          Changes here are kept for this visit and sent together with call notes and the order list from Call notes, once that's built — nothing's saved to the server until then.
        </div>
      </div>
      <div class="detail-section">
        <h2>5-Year Wholegoods Sales History ${gapCount > 0 ? `<span class="gap-badge">${gapCount} range gap${gapCount === 1 ? '' : 's'}</span>` : ''}</h2>
        ${historyItems.length === 0
          ? `<div class="placeholder-note">No wholegoods purchases in the last 5 years for this account.</div>`
          : `<div style="overflow-x:auto;">
              <table class="wholegoods-table">
                <thead>
                  <tr>
                    <th>Stockcode</th><th>Description</th>
                    ${sortedYears.map(y => `<th>${y}</th>`).join('')}
                    <th>5yr Total</th><th style="text-align:left;">Range</th><th style="text-align:left;">Order</th>
                  </tr>
                </thead>
                <tbody>${historyItems.map(historyRow).join('')}</tbody>
              </table>
            </div>`}
      </div>
    `

    // Qty edits: recompute status on blur/enter, not every keystroke
    function clearNoteIfNoLongerADecrease(id) {
      const e = checklistState[id]
      const stillADecrease = !e.isNew && e.last_recorded_qty !== null && Number(e.qty) < Number(e.last_recorded_qty)
      if (!stillADecrease) { e.note = ''; e.markedForRemoval = false }
    }
    content.querySelectorAll('.stock-line-qty').forEach(input => {
      input.addEventListener('change', (e) => {
        const id = e.target.dataset.id
        checklistState[id].qty = e.target.value
        clearNoteIfNoLongerADecrease(id)
        renderWholegoodsPage(accno, dealerName)
      })
    })
    content.querySelectorAll('.qty-step-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id
        const dir = Number(btn.dataset.dir)
        const next = Math.max(0, Number(checklistState[id].qty) + dir)
        checklistState[id].qty = next
        clearNoteIfNoLongerADecrease(id)
        renderWholegoodsPage(accno, dealerName)
      })
    })
    content.querySelectorAll('.remove-item-checkbox').forEach(cb => {
      cb.addEventListener('change', (e) => {
        checklistState[e.target.dataset.id].markedForRemoval = e.target.checked
      })
    })
    content.querySelectorAll('.stock-toggle').forEach(toggle => {
      toggle.addEventListener('change', (e) => {
        checklistState[e.target.dataset.id].confirmed = e.target.checked
        renderWholegoodsPage(accno, dealerName)
      })
    })
    content.querySelectorAll('.stock-line-note').forEach(input => {
      input.addEventListener('change', (e) => {
        checklistState[e.target.dataset.id].note = e.target.value
      })
    })
    // Known brands where the description's first word IS the brand and can
    // be split out cleanly - a whitelist rather than a list of exceptions,
    // so anything NOT on this list just leaves Brand blank (same as manual
    // entry today) instead of risking a confidently wrong split on a brand
    // we don't know about yet. Values are the canonical casing to save,
    // regardless of how EXO happens to capitalise it in any given
    // description. Add to this list as new brands come up.
    const KNOWN_BRANDS = {
      echo: 'Echo', shindaiwa: 'Shindaiwa', greenworks: 'Greenworks', atom: 'Atom',
      stiga: 'Stiga', mountfield: 'Mountfield', mojack: 'MoJack', archer: 'Archer',
      atex: 'Atex', sina: 'Sina', cox: 'Cox', meiwa: 'Meiwa',
    }
    function splitBrandFromDescription(description) {
      const desc = (description || '').trim()
      const firstSpace = desc.indexOf(' ')
      const firstWord = (firstSpace === -1 ? desc : desc.slice(0, firstSpace)).toLowerCase()
      const known = KNOWN_BRANDS[firstWord]
      if (!known) return { brand: '', description: desc }
      return { brand: known, description: (firstSpace === -1 ? '' : desc.slice(firstSpace + 1).trim()) }
    }

    // Shared SKU/model lookup for the two floor-stock add forms below - same
    // wholegoods-only search as the Stock Lookup screen, so typing either a
    // real SKU or a model number found in the description both work. Tapping
    // a result fills in the SKU, Brand (if recognised - see KNOWN_BRANDS
    // above) and Description fields; Qty is left for manual entry. Manual
    // typing into the fields directly still works as a fallback for
    // anything not in the catalogue, or a brand not yet on the list.
    function wireStockSearchInput(searchInputId, resultsId, skuInputId, brandInputId, descInputId) {
      const searchInput = document.getElementById(searchInputId)
      const resultsEl = document.getElementById(resultsId)
      if (!searchInput || !resultsEl) return
      let searchTimeout = null
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout)
        const q = e.target.value.trim()
        if (q.length < 2) { resultsEl.style.display = 'none'; resultsEl.innerHTML = ''; return }
        searchTimeout = setTimeout(async () => {
          resultsEl.style.display = 'block'
          resultsEl.innerHTML = `<div class="stock-search-result">Searching…</div>`
          const { data, error } = await supabase
            .from('stock_items')
            .select('stockcode, description')
            .eq('stockgroup2', 2)
            .eq('is_active', true)
            .or(`stockcode.ilike.%${q}%,description.ilike.%${q}%`)
            .order('description')
            .limit(20)
          if (error) { resultsEl.innerHTML = `<div class="stock-search-result">Search failed: ${error.message}</div>`; return }
          if (!data || data.length === 0) { resultsEl.innerHTML = `<div class="stock-search-result">No match for "${q}".</div>`; return }
          resultsEl.innerHTML = data.map(item => `
            <div class="stock-search-result" data-stockcode="${item.stockcode}" data-description="${(item.description || '').replace(/"/g, '&quot;')}">
              <strong>${item.stockcode}</strong> — ${item.description || ''}
            </div>
          `).join('')
          resultsEl.querySelectorAll('.stock-search-result[data-stockcode]').forEach(row => {
            // mousedown, not click - fires before the search input's blur
            // event would otherwise hide the dropdown first
            row.addEventListener('mousedown', (ev) => {
              ev.preventDefault()
              const { brand, description } = splitBrandFromDescription(row.dataset.description)
              document.getElementById(skuInputId).value = row.dataset.stockcode
              document.getElementById(brandInputId).value = brand
              document.getElementById(descInputId).value = description
              searchInput.value = ''
              resultsEl.style.display = 'none'
              resultsEl.innerHTML = ''
            })
          })
        }, 250)
      })
      searchInput.addEventListener('blur', () => {
        setTimeout(() => { resultsEl.style.display = 'none' }, 150)
      })
    }
    wireStockSearchInput('newLineStockSearch', 'newLineStockResults', 'newSku', 'newBrand', 'newDesc')
    wireStockSearchInput('quickAddStockSearch', 'quickAddStockResults', 'quickSku', 'quickBrand', 'quickDesc')

    const openBtn = document.getElementById('openAddLine')
    if (openBtn) openBtn.onclick = () => { addLineFormOpen = true; renderWholegoodsPage(accno, dealerName) }
    const confirmAddBtn = document.getElementById('confirmAddLine')
    if (confirmAddBtn) confirmAddBtn.onclick = () => {
      const id = `new-${newLineSeq++}`
      checklistState[id] = {
        id, brand: document.getElementById('newBrand').value,
        sku: document.getElementById('newSku').value,
        description: document.getElementById('newDesc').value,
        last_recorded_qty: null,
        qty: document.getElementById('newQty').value || 0,
        confirmed: false, isNew: true, note: '',
      }
      addLineFormOpen = false
      renderWholegoodsPage(accno, dealerName)
    }

    const openQuickAddBtn = document.getElementById('openQuickAdd')
    if (openQuickAddBtn) openQuickAddBtn.onclick = () => { quickAddFormOpen = true; renderWholegoodsPage(accno, dealerName) }
    const confirmQuickAddBtn = document.getElementById('confirmQuickAdd')
    if (confirmQuickAddBtn) confirmQuickAddBtn.onclick = async () => {
      const sku = document.getElementById('quickSku').value
      const brand = document.getElementById('quickBrand').value
      const description = document.getElementById('quickDesc').value
      const qty = document.getElementById('quickQty').value || 0
      confirmQuickAddBtn.disabled = true
      confirmQuickAddBtn.textContent = 'Saving…'
      const today = new Date().toISOString().slice(0, 10)
      const { data, error } = await supabase.from('dealer_floor_stock').insert({
        accno, brand, sku, description,
        last_recorded_qty: qty, last_recorded_date: today,
      }).select().single()
      if (error) {
        alert('Could not save: ' + error.message)
        confirmQuickAddBtn.disabled = false
        confirmQuickAddBtn.textContent = 'Save now'
        return
      }
      // Reflect it immediately as a normal existing line - not tied to
      // this visit's checklist changes, since nothing here goes near
      // Send Report.
      checklistState[data.id] = {
        id: data.id, brand: data.brand, sku: data.sku, description: data.description,
        last_recorded_qty: data.last_recorded_qty, qty: data.last_recorded_qty,
        confirmed: false, isNew: false, note: '',
      }
      quickAddFormOpen = false
      renderWholegoodsPage(accno, dealerName)
    }

    content.querySelectorAll('.add-range-btn[data-stockcode]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true
        btn.textContent = 'Adding…'
        const { error } = await supabase.from('dealer_ranges').upsert(
          { accno, stockcode: btn.dataset.stockcode, added_by: currentUserLabel, is_active: true },
          { onConflict: 'accno,stockcode' }
        )
        if (error) {
          btn.textContent = 'Failed — try again'
          btn.disabled = false
          return
        }
        // Also add it as a new floor stock checklist line, since it's
        // now part of the agreed range but has no prior recorded qty.
        const newId = `new-${newLineSeq++}`
        checklistState[newId] = {
          id: newId, brand: '', sku: btn.dataset.stockcode, description: btn.dataset.description,
          last_recorded_qty: null, qty: 0, confirmed: false, isNew: true, note: '',
        }
        // Refresh the history data (range status) without wiping checklist edits
        const { data: historyRows } = await supabase.rpc('get_wholegoods_history', { p_accno: accno })
        cachedHistoryRows = historyRows || []
        renderWholegoodsPage(accno, dealerName)
      })
    })

    content.querySelectorAll('.order-btn[data-ordersku]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentOrderList.push({ sku: btn.dataset.ordersku, description: btn.dataset.orderdesc, qty: 1 })
        renderWholegoodsPage(accno, dealerName)
      })
    })
  }

  // ---------- CALL NOTES TAB ----------
  async function showCallNotesTab(accno) {
    resetVisitIfNewDealer(accno)
    document.getElementById('listHeaderRow').style.display = 'none'
    const dealer = currentDealers.find(d => d.accno === accno)
    renderDetailSidebar(dealer ? dealer.name : null, accno, 'callnotes')
    topbarTitle.textContent = dealer ? dealer.name : 'Account'
    topbarSubtitle.textContent = `Account #${accno}`
    topbarRight.innerHTML = ''

    if (callNotesInitialized) {
      renderCallNotesPage(accno, dealer ? dealer.name : `Account #${accno}`)
      return
    }

    content.innerHTML = `<div class="empty-state">Loading…</div>`
    const [
      { data: followups, error: followupsErr },
      { data: recentCalls, error: callsErr },
    ] = await Promise.all([
      supabase.from('dealer_followups').select('*').eq('accno', accno).eq('is_resolved', false).order('created_at', { ascending: false }),
      supabase.rpc('get_recent_call_notes', { p_accno: accno, p_limit: 1 }),
    ])
    if (followupsErr || callsErr) {
      const err = followupsErr || callsErr
      content.innerHTML = `<div class="empty-state">Couldn't load call notes: ${err.message}</div>`
      return
    }
    cachedFollowups = followups || []
    cachedRecentCalls = recentCalls || []
    callNotesInitialized = true
    renderCallNotesPage(accno, dealer ? dealer.name : `Account #${accno}`)
  }

  function renderCallNotesPage(accno, dealerName) {
    const stockEntries = Object.values(checklistState)
    const confirmedCount = stockEntries.filter(e => computeAutoStatus(e) === 'confirmed').length
    const updatedEntries = stockEntries.filter(e => computeAutoStatus(e) === 'updated')
    const newEntries = stockEntries.filter(e => computeAutoStatus(e) === 'new')
    const hasStockChanges = confirmedCount + updatedEntries.length + newEntries.length > 0

    const followupsHtml = cachedFollowups.map(f => `
      <div class="followup-banner">
        <div>
          <div class="fu-text">${f.note}</div>
          <div class="fu-meta">${f.created_by || 'Office'} · ${formatNZDate(f.created_at)}</div>
        </div>
        <button class="followup-resolve-btn" data-id="${f.id}">Mark done</button>
      </div>
    `).join('')

    const recentCallsHtml = cachedRecentCalls.length === 0
      ? `<div class="placeholder-note">No previous call notes recorded for this dealer.</div>`
      : cachedRecentCalls.map(c => `
          <div class="recent-call-card">
            <div class="recent-call-meta">${formatNZDate(c.visit_date)} · ${c.rep_name || 'Unknown rep'}</div>
            <div class="recent-call-notes">${c.call_notes || '(no notes written)'}</div>
          </div>
        `).join('')

    const orderRowsHtml = currentOrderList.map((o, i) => `
      <tr>
        <td>
          <div class="qty-stepper">
            <button class="qty-step-btn order-qty-step-btn" data-idx="${i}" data-dir="-1">−</button>
            <input class="order-table-input order-qty-cell" type="number" min="1" data-idx="${i}" data-field="qty" value="${o.qty}">
            <button class="qty-step-btn order-qty-step-btn" data-idx="${i}" data-dir="1">+</button>
          </div>
        </td>
        <td><input class="order-table-input" type="text" data-idx="${i}" data-field="sku" value="${o.sku || ''}" placeholder="Part number"></td>
        <td><input class="order-table-input" type="text" data-idx="${i}" data-field="description" value="${o.description || ''}" placeholder="Description (optional)"></td>
        <td><button class="order-remove-btn" data-idx="${i}">✕</button></td>
      </tr>
    `).join('')

    content.innerHTML = `
      <div class="detail-section">
        <h2>Order</h2>
        <table class="order-table">
          <thead><tr><th style="width:150px;">Qty</th><th>Part number</th><th>Description</th><th style="width:40px;"></th></tr></thead>
          <tbody id="orderTableBody">${orderRowsHtml}</tbody>
        </table>
        <button class="add-range-btn" id="addOrderRowBtn" style="margin-top:10px;">+ Add row</button>
      </div>
      <div class="detail-section">
        <h2>Call notes</h2>
        <textarea class="notes-textarea" id="callNotesText" placeholder="What happened on this visit?">${currentCallNotes}</textarea>
      </div>
      <div class="detail-columns">
        <div class="detail-section">
          <h2>This visit's stock changes</h2>
          ${hasStockChanges
            ? `<div class="report-summary">${confirmedCount} confirmed · ${updatedEntries.length} updated · ${newEntries.length} new</div>`
            : `<div class="placeholder-note">No stock changes recorded this visit yet — open the Wholegoods tab to work through the floor stock checklist.</div>`}
        </div>
        <div class="detail-section">
          <h2>Follow-ups</h2>
          ${followupsHtml || `<div class="placeholder-note">No open follow-ups for this dealer.</div>`}
          <div class="add-followup-form">
            <textarea id="newFollowupText" placeholder='Leave a note for whoever visits next, e.g. "customer called about warranty claim, please follow up"'></textarea>
            <button class="confirm-btn" id="addFollowupBtn">Save note</button>
          </div>
        </div>
      </div>
      <div class="detail-section">
        <h2>Last call notes</h2>
        ${recentCallsHtml}
      </div>
      <div class="detail-section">
        <div class="send-report-bar" style="border-top:none; padding-top:0; margin-top:0;">
          <div class="report-summary">Sends stock changes, this order, and your notes together to sales support.</div>
          <button class="send-report-btn" id="sendReportBtn">Send Report</button>
        </div>
      </div>
    `

    document.getElementById('callNotesText').addEventListener('change', (e) => {
      currentCallNotes = e.target.value
    })

    document.getElementById('addFollowupBtn').onclick = async () => {
      const text = document.getElementById('newFollowupText').value.trim()
      if (!text) return
      const btn = document.getElementById('addFollowupBtn')
      btn.disabled = true
      const { error } = await supabase.from('dealer_followups').insert({ accno, note: text, created_by: currentUserLabel })
      if (error) { alert('Could not save note: ' + error.message); btn.disabled = false; return }
      const { data } = await supabase.from('dealer_followups').select('*').eq('accno', accno).eq('is_resolved', false).order('created_at', { ascending: false })
      cachedFollowups = data || []
      renderCallNotesPage(accno, dealerName)
    }

    content.querySelectorAll('.followup-resolve-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true
        btn.textContent = 'Saving…'
        await supabase.from('dealer_followups').update({
          is_resolved: true, resolved_by: currentUserLabel, resolved_at: new Date().toISOString(),
        }).eq('id', btn.dataset.id)
        cachedFollowups = cachedFollowups.filter(f => String(f.id) !== btn.dataset.id)
        renderCallNotesPage(accno, dealerName)
      })
    })

    // Order table: every field editable inline, no lookup - update on
    // blur/enter so typing doesn't trigger a re-render every keystroke.
    content.querySelectorAll('.order-table-input').forEach(input => {
      input.addEventListener('change', (e) => {
        const idx = Number(e.target.dataset.idx)
        currentOrderList[idx][e.target.dataset.field] = e.target.value
      })
    })
    content.querySelectorAll('.order-qty-step-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.idx)
        const dir = Number(btn.dataset.dir)
        currentOrderList[idx].qty = Math.max(1, Number(currentOrderList[idx].qty) + dir)
        renderCallNotesPage(accno, dealerName)
      })
    })
    content.querySelectorAll('.order-remove-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentOrderList.splice(Number(btn.dataset.idx), 1)
        renderCallNotesPage(accno, dealerName)
      })
    })
    document.getElementById('addOrderRowBtn').onclick = () => {
      currentOrderList.push({ qty: 1, sku: '', description: '' })
      renderCallNotesPage(accno, dealerName)
    }

    document.getElementById('sendReportBtn').onclick = () => sendCallReport(accno, dealerName)
  }

  async function sendCallReport(accno, dealerName) {
    const btn = document.getElementById('sendReportBtn')
    btn.disabled = true
    btn.textContent = 'Sending…'
    const today = new Date().toISOString().slice(0, 10)

    // Read straight from the DOM first, in case a field's "change"
    // event hasn't fired yet - e.g. typing notes then immediately
    // tapping Send Report on a touchscreen can beat the blur event.
    const notesEl = document.getElementById('callNotesText')
    if (notesEl) currentCallNotes = notesEl.value
    document.querySelectorAll('.order-table-input').forEach(input => {
      const idx = Number(input.dataset.idx)
      if (currentOrderList[idx]) currentOrderList[idx][input.dataset.field] = input.value
    })
    document.querySelectorAll('.stock-line-qty').forEach(input => {
      if (checklistState[input.dataset.id]) checklistState[input.dataset.id].qty = input.value
    })

    const entries = Object.values(checklistState)
    const confirmed = entries.filter(e => computeAutoStatus(e) === 'confirmed')
    const updated = entries.filter(e => computeAutoStatus(e) === 'updated')
    const newLines = entries.filter(e => computeAutoStatus(e) === 'new')

    // Anything marked for removal needs an actual reason before we'll send.
    const missingReason = updated.find(e => e.markedForRemoval && !e.note?.trim())
    if (missingReason) {
      alert(`"${missingReason.brand || ''} ${missingReason.sku || ''}" is marked for removal but has no reason in the notes box - add one before sending.`)
      btn.disabled = false
      btn.textContent = 'Send Report'
      return
    }

    const toRemove = updated.filter(e => e.markedForRemoval)
    const toUpdate = confirmed.concat(updated.filter(e => !e.markedForRemoval))

    try {
      for (const e of toUpdate) {
        const { error } = await supabase.from('dealer_floor_stock')
          .update({ last_recorded_qty: e.qty, last_recorded_date: today, notes: null })
          .eq('id', e.id)
        if (error) throw error
      }
      for (const e of toRemove) {
        const { error } = await supabase.from('dealer_floor_stock')
          .update({ last_recorded_qty: 0, last_recorded_date: today, notes: e.note, is_active: false })
          .eq('id', e.id)
        if (error) throw error
      }
      for (const e of newLines) {
        const { error } = await supabase.from('dealer_floor_stock').insert({
          accno, brand: e.brand, sku: e.sku, description: e.description,
          last_recorded_qty: e.qty, last_recorded_date: today, notes: null,
        })
        if (error) throw error
      }
      const { error: callLogError } = await supabase.from('call_logs').insert({
        accno, rep_salesno: currentStaffno, visit_date: today,
        call_notes: currentCallNotes, order_items: currentOrderList,
      })
      if (callLogError) throw callLogError
    } catch (err) {
      alert('Something went wrong sending the report: ' + err.message)
      btn.disabled = false
      btn.textContent = 'Send Report'
      return
    }

    let body = `Call report for ${dealerName} (Account #${accno})\n\n`
    body += `NOTES:\n${currentCallNotes || '(none)'}\n\n`

    const allChecked = confirmed.concat(updated).concat(newLines)
    body += `STOCK CHECK (${allChecked.length} item${allChecked.length === 1 ? '' : 's'} checked):\n`
    confirmed.forEach(e => { body += `- ${e.brand || ''} ${e.sku || ''}: ${e.qty} (confirmed)\n` })
    updated.forEach(e => {
      const isDecrease = Number(e.qty) < Number(e.last_recorded_qty)
      if (e.markedForRemoval) {
        body += `- ${e.brand || ''} ${e.sku || ''}: ${e.last_recorded_qty} → 0 (REMOVED FROM CHECKLIST - ${e.note})\n`
      } else if (isDecrease && e.note) {
        body += `- ${e.brand || ''} ${e.sku || ''}: ${e.last_recorded_qty} → ${e.qty} (${e.note})\n`
      } else {
        body += `- ${e.brand || ''} ${e.sku || ''}: ${e.last_recorded_qty} → ${e.qty} (updated)\n`
      }
    })
    newLines.forEach(e => { body += `- ${e.brand || ''} ${e.sku || ''} ${e.description || ''}: ${e.qty} (new)\n` })
    if (allChecked.length === 0) body += `(none)\n`

    body += `\nORDER (${currentOrderList.length} item${currentOrderList.length === 1 ? '' : 's'}):\n`
    if (currentOrderList.length === 0) body += `(none)\n`
    currentOrderList.forEach(o => { body += `- ${o.qty} x ${o.sku || '(no part number)'}${o.description ? ' - ' + o.description : ''}\n` })

    // CC the rep who made the call - firstname@camaproducts.co.nz
    const repFirstName = (currentUserLabel || '').split(' ')[0].toLowerCase()
    const repEmail = repFirstName ? `${repFirstName}@camaproducts.co.nz` : ''

    const subject = encodeURIComponent(`Call report - ${dealerName}`)
    const ccParam = repEmail ? `&cc=${encodeURIComponent(repEmail)}` : ''
    window.location.href = `mailto:${SALES_SUPPORT_EMAIL}?subject=${subject}${ccParam}&body=${encodeURIComponent(body)}`

    currentVisitAccno = null
    currentOrderList = []
    checklistState = {}
    wholegoodsInitialized = false
    currentCallNotes = ''
    callNotesInitialized = false
    renderAccountsList()
  }

  // ---------- ON LOAD: resume an existing session if there is one ----------
  ;(async () => {
    const { data } = await supabase.auth.getSession()
    if (data.session) {
      staffno = data.session.user.email.replace('staff', '').replace('@camarep.internal', '')
      enterApp(data.session.user)
    } else {
      renderStaffEntry()
    }
  })()
</script>
